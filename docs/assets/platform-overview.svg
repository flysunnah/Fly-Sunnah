<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Fly Sunnah Universal Enterprise Platform</title>
<desc id="desc">A product architecture visual showing public experience, authentication, role based workspaces, enterprise suites, and the universal core.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".22"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="90" y="92" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">Fly Sunnah</text>
<text x="90" y="142" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="27">Universal Enterprise Platform</text>
<rect x="90" y="178" width="1420" height="116" rx="24" fill="#fff" opacity=".08" stroke="#fff" stroke-opacity=".14"/>
<text x="130" y="225" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">ONE CORE · MANY BUSINESSES · CONFIGURATION-DRIVEN</text>
<text x="130" y="263" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20">ERP • CRM • OTA • Documents • Finance • Marketing • Support • Analytics • Integrations</text>

